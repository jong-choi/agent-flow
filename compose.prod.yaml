services:
  agentflow-app:
    container_name: agentflow-app
    build:
      context: .
      dockerfile: prod.Dockerfile
      args:
        NEXT_PUBLIC_ENABLE_DEV_LOGIN: ${NEXT_PUBLIC_ENABLE_DEV_LOGIN:-false}
      secrets:
        - database_url

    environment:
      NODE_OPTIONS: --max-old-space-size=512
      DATABASE_URL: ${DATABASE_URL}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      TEST_PASSWORD: ${TEST_PASSWORD}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      SEARXNG_API_KEY: ${SEARXNG_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_URL: ${AUTH_URL}
      BASE_URL: ${BASE_URL}
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: ${NEXT_PUBLIC_ENABLE_DEV_LOGIN}
      GOOGLE_SEARCH_CX: ${GOOGLE_SEARCH_CX}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL}

    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    restart: unless-stopped

    ports:
      - "3040:3000"

    networks:
      - npm-network

  agentflow-maintenance:
    profiles: ["maintenance"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    build:
      context: .
      dockerfile: maintenance.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      AI_MAINTENANCE_ENABLED: ${AI_MAINTENANCE_ENABLED:-false}
      NODE_OPTIONS: --max-old-space-size=256
    restart: "no"
    networks:
      - npm-network

networks:
  npm-network:
    external: true

secrets:
  database_url:
    environment: DATABASE_URL
